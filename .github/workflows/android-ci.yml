name: Android CI
on:
  push: { branches: [main] }
  pull_request:
# Quiet the "Node.js 20 actions are deprecated" warning: force any action whose
# internal manifest still declares Node 20 to run on Node 24. The actions used
# here (checkout@v5, setup-java@v5, upload-artifact@v5) are the current majors;
# this only silences the transitional warning until GitHub updates their bundled
# Node target. Harmless to keep.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Fetch non-committed model assets
        run: |
          cd android/app/src/main/assets
          # face_landmarker.task is NOT committed (large / .gitignored) so is
          # fetched here. The detection models yolo26n.tflite, gtsrb_sign.tflite
          # and traffic_light.tflite are committed and validated; do NOT
          # overwrite them. (The EfficientDet fallback download was removed in
          # v1.20.15 along with the unreachable fallback path — see
          # PLAY-COMPLIANCE.md.)
          curl -fLO https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Release keystore decoded."
          else
            echo "No KEYSTORE_BASE64 secret — will build debug only."
          fi
      - name: Build
        working-directory: android
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          # The runner's PRE-INSTALLED Gradle is now 9.6.x. AGP 8.x cannot be
          # applied under Gradle 9.6+ (it uses org.gradle.api.problems.internal
          # .InternalProblems, removed in Gradle 9.6.0). Running
          # `gradle wrapper` here would make that system Gradle CONFIGURE this
          # project — applying AGP — and fail before the build even starts.
          #
          # Fix: generate the wrapper in an EMPTY scratch project, so the system
          # Gradle never evaluates our build scripts, then copy it in. The build
          # itself then runs under the pinned wrapper version (8.14), which IS
          # compatible with AGP 8.12. This also insulates CI from future bumps
          # of the runner's system Gradle.
          WRAPGEN="$RUNNER_TEMP/wrapgen"
          mkdir -p "$WRAPGEN"
          echo "rootProject.name = \"wrapgen\"" > "$WRAPGEN/settings.gradle.kts"
          ( cd "$WRAPGEN" && gradle wrapper --gradle-version 8.14 )
          mkdir -p gradle
          cp -r "$WRAPGEN/gradle/." gradle/
          cp "$WRAPGEN/gradlew" "$WRAPGEN/gradlew.bat" .
          chmod +x gradlew
          ./gradlew --version
          if [ -n "$KEYSTORE_FILE" ]; then
            ./gradlew lint assembleDebug assembleRelease bundleRelease
          else
            echo "No signing secrets present — building debug only."
            ./gradlew lint assembleDebug
          fi
      - name: Check 16 KB page alignment of native libraries
        working-directory: android
        run: |
          # Google Play rejects bundles whose native .so files have LOAD segments
          # aligned to 4 KB (0x1000) instead of 16 KB (0x4000). Every .so here comes
          # from a third-party AAR, so the fix is always a dependency bump.
          #
          # IMPORTANT: some libraries report as unaligned by readelf yet Play has
          # ACCEPTED them in the live build (see PLAY-COMPLIANCE.md). Those are
          # listed in KNOWN_ACCEPTED below and reported as NOTE, not as a blocker,
          # so this check only raises a real "WILL reject" warning for a NEW
          # offender — not the same known-benign files every build.
          KNOWN_ACCEPTED="libmlkit_google_ocr_pipeline.so libandroidx.graphics.path.so"
          APK=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -1 || true)
          if [ -z "$APK" ]; then APK=$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null | head -1 || true); fi
          if [ -z "$APK" ]; then echo "No APK found; skipping."; exit 0; fi
          echo "Checking native library alignment in $APK"
          rm -rf "$RUNNER_TEMP/alncheck"; mkdir -p "$RUNNER_TEMP/alncheck"
          unzip -qo "$APK" 'lib/*' -d "$RUNNER_TEMP/alncheck" || true
          BAD=0
          for so in $(find "$RUNNER_TEMP/alncheck/lib" -name '*.so' | sort); do
            AL=$(readelf -lW "$so" 2>/dev/null | awk '/LOAD/ {print $NF; exit}')
            REL=${so#"$RUNNER_TEMP/alncheck/"}
            BASE=$(basename "$so")
            case "$AL" in
              0x4000|0x10000) echo "  OK        $AL  $REL" ;;
              *)
                # unaligned — is it a known-accepted library, or a new offender?
                if echo "$KNOWN_ACCEPTED" | grep -qw "$BASE"; then
                  echo "  NOTE      $AL  $REL  (unaligned but accepted by Play — see PLAY-COMPLIANCE.md)"
                else
                  echo "  UNALIGNED $AL  $REL  (NEW — not on the known-accepted list)"
                  BAD=1
                fi
                ;;
            esac
          done
          if [ "$BAD" = 1 ]; then
            echo "::warning::A NEW native library above is not 16 KB aligned and is not on the known-accepted list. Google Play may reject this bundle. Bump the dependency that ships it (see PLAY-COMPLIANCE.md). If Play later accepts it, add it to KNOWN_ACCEPTED."
          else
            echo "All native libraries are either 16 KB aligned or known-accepted by Play."
          fi

      - uses: actions/upload-artifact@v5
        with: { name: DBM-apk-debug, path: android/app/build/outputs/apk/debug/*.apk }
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: DBM-apk-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: DBM-aab-release
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
      # R8 mapping file — needed to deobfuscate release-build stack traces
      # (turn "i3.c" back into the real class name). Generated only on the
      # minified release build and otherwise discarded with the runner.
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: DBM-mapping-release
          path: android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
      # Native debug symbols — AGP (with ndk.debugSymbolLevel=FULL and a usable
      # NDK) embeds these in the .aab automatically, so Play reads them from the
      # bundle. We also archive the standalone symbol zip as a fallback in case
      # you ever need to upload it to the Play Console manually.
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: DBM-native-debug-symbols
          path: android/app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v5
        if: always()
        with: { name: lint-report, path: android/app/build/reports/lint-results-*.html }
